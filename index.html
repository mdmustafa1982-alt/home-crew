<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Crew</title>
<meta name="description" content="Daily work, menu, shopping, payments and budget for our home staff.">
<meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141729" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Crew">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Look & feel matches Inaaya's Scoreboard: Fredoka + Nunito, soft blue paper, gold selection, one colour per person. */
:root{
  --bg:#F3F6FB;--paper:#FFFFFF;--ink:#1E2340;--ink-2:#565C7D;--ink-3:#8A90AE;--line:#DCE1EE;--soft:#EEF1F8;
  --gold:#F5B82E;--gold-ink:#7A5200;--gold-tint:#FFF4D6;
  --dawn:#F08A4B;--dawn-tint:#FFF1E7;
  --day:#3B93DC;--day-tint:#EAF4FD;
  --noon:#3FA465;--noon-tint:#E9F7EE;
  --dusk:#7B68E0;--dusk-tint:#F0EEFD;
  --all:#E0577E;--all-tint:#FDEDF2;
  --aqua:#1BA7C4;--aqua-tint:#E4F7FB;
  --check-ink:#FFFFFF;
  /* roles used by the app code */
  --pri:var(--dusk);--pri-ink:#FFFFFF;--pri-soft:var(--dusk-tint);
  --good:var(--noon);--good-soft:var(--noon-tint);--warn:#B7790C;--warn-soft:var(--gold-tint);--bad:#D2445F;--bad-soft:var(--all-tint);
  --acc:var(--dawn);--acc-soft:var(--dawn-tint);
  --c1:#7B68E0;--c2:#F08A4B;--c3:#3B93DC;--c4:#E0577E;--c5:#3FA465;--c6:#B26AD8;--c7:#1BA7C4;--c8:#D2445F;--c9:#C9962A;--c10:#8A90AE;
  --shadow:0 1px 0 rgba(30,35,64,.04),0 8px 20px -12px rgba(30,35,64,.3);
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#141729;--paper:#1D2138;--ink:#EEF0FA;--ink-2:#A7ACC8;--ink-3:#7A809F;--line:#30355A;--soft:#252A45;
  --gold:#F7C653;--gold-ink:#FFE3A1;--gold-tint:#3A3220;
  --dawn:#FF9D63;--dawn-tint:#33251F;--day:#62AEF0;--day-tint:#1C2A40;
  --noon:#5CC482;--noon-tint:#1B3127;--dusk:#9A8BF5;--dusk-tint:#26234A;
  --all:#F27799;--all-tint:#3A2130;--aqua:#3CC3DE;--aqua-tint:#16313A;
  --check-ink:#141729;--pri-ink:#141729;--warn:#F7C653;--bad:#F27799;
  --c1:#9A8BF5;--c2:#FF9D63;--c3:#62AEF0;--c4:#F27799;--c5:#5CC482;--c6:#C98BEA;--c7:#3CC3DE;--c8:#F0707F;--c9:#E0B656;--c10:#7A809F;
  --shadow:0 8px 20px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141729;--paper:#1D2138;--ink:#EEF0FA;--ink-2:#A7ACC8;--ink-3:#7A809F;--line:#30355A;--soft:#252A45;
  --gold:#F7C653;--gold-ink:#FFE3A1;--gold-tint:#3A3220;
  --dawn:#FF9D63;--dawn-tint:#33251F;--day:#62AEF0;--day-tint:#1C2A40;
  --noon:#5CC482;--noon-tint:#1B3127;--dusk:#9A8BF5;--dusk-tint:#26234A;
  --all:#F27799;--all-tint:#3A2130;--aqua:#3CC3DE;--aqua-tint:#16313A;
  --check-ink:#141729;--pri-ink:#141729;--warn:#F7C653;--bad:#F27799;
  --c1:#9A8BF5;--c2:#FF9D63;--c3:#62AEF0;--c4:#F27799;--c5:#5CC482;--c6:#C98BEA;--c7:#3CC3DE;--c8:#F0707F;--c9:#E0B656;--c10:#7A809F;
  --shadow:0 8px 20px -12px rgba(0,0,0,.6);
}
:where(.pstep,.staff,.slot){--tone:var(--day);--tint:var(--day-tint)}
[data-tone="dawn"]{--tone:var(--dawn);--tint:var(--dawn-tint)}
[data-tone="gold"]{--tone:var(--gold);--tint:var(--gold-tint)}
[data-tone="day"]{--tone:var(--day);--tint:var(--day-tint)}
[data-tone="aqua"]{--tone:var(--aqua);--tint:var(--aqua-tint)}
[data-tone="noon"]{--tone:var(--noon);--tint:var(--noon-tint)}
[data-tone="dusk"]{--tone:var(--dusk);--tint:var(--dusk-tint)}
[data-tone="all"]{--tone:var(--all);--tint:var(--all-tint)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.38 var(--body);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:800}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:66px;padding-top:6px;padding-bottom:6px}
.brand{display:flex;flex-direction:column;gap:3px;margin-right:auto;min-width:0}
.hi{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.05;letter-spacing:-.005em}
.hi span{color:var(--dawn)}
.daypill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:3px 11px}
.who{display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px 4px 5px;font-weight:800;font-size:14px}
.who b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--dawn-tint);color:var(--dawn);font-family:var(--display);font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--ink)}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink-3);margin-right:6px;vertical-align:1px}
.syncdot.on{background:var(--noon)}.syncdot.wait{background:var(--gold)}.syncdot.bad{background:var(--all)}
/* ---------- tab bar: a floating pill, like Inaaya's app ---------- */
.nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.nav .wrap{pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:560px;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:5px;box-shadow:0 10px 30px -12px rgba(30,35,64,.45);margin:0 12px}
@media (min-width:600px){.nav .wrap{margin:0 auto}}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.nav button span{font-size:23px;line-height:1.05}
.nav button.on{background:var(--gold-tint);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
/* ---------- page ---------- */
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:14px 0 4px}
h2{font-family:var(--display);font-weight:700;font-size:21px;margin:26px 2px 10px;display:flex;align-items:center;gap:8px;line-height:1.15}
h2 small,h1 small{font-family:var(--body);font-weight:800;color:var(--ink-2);font-size:13.5px}
.sub{color:var(--ink-2);margin:0 0 14px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
a{color:var(--dusk)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.datebar{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.datebar .d{font-family:var(--display);font-weight:700;font-size:23px;flex:1;min-width:0;line-height:1.1}
.datebar .d small{display:block;font-family:var(--body);font-weight:800;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.card.flat{box-shadow:none}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 16px;font-family:var(--display);font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;color:var(--ink);box-shadow:0 1px 0 rgba(30,35,64,.05)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--dusk);border-color:var(--dusk);color:var(--pri-ink);box-shadow:var(--shadow)}
.btn.acc{background:var(--dawn);border-color:var(--dawn);color:#fff}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.sm{padding:4px 12px;min-height:34px;font-size:14px}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:800;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--noon-tint);color:var(--noon)}.chip.warn{background:var(--gold-tint);color:var(--gold-ink)}.chip.bad{background:var(--all-tint);color:var(--bad)}.chip.pri{background:var(--dusk-tint);color:var(--dusk)}.chip.acc{background:var(--dawn-tint);color:var(--dawn)}
input.in,select.in,textarea.in{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;min-height:44px;font-weight:700}
textarea.in{min-height:68px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
input::placeholder,textarea::placeholder{color:var(--ink-3);font-weight:600}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--dusk)}
label.f{display:block;font-size:13.5px;font-weight:800;color:var(--ink-2);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
/* heading icon badges + coloured number tiles */
.hic{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;font-size:19px;flex:none;background:var(--tint);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tone) 35%,transparent)}
h1 .hic{width:42px;height:42px;font-size:23px;border-radius:14px;vertical-align:-8px;margin-right:6px}
h1:has(.hic){display:flex;align-items:center;gap:4px}
.summary .stat:nth-child(4n+1){--tone:var(--gold);--tint:var(--gold-tint)}
.summary .stat:nth-child(4n+2){--tone:var(--dusk);--tint:var(--dusk-tint)}
.summary .stat:nth-child(4n+3){--tone:var(--dawn);--tint:var(--dawn-tint)}
.summary .stat:nth-child(4n+4){--tone:var(--noon);--tint:var(--noon-tint)}
.summary .stat{background:var(--tint);border-color:color-mix(in srgb,var(--tone) 45%,var(--line))}
.summary .stat b{color:var(--ink)}
.bud .l b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:4px;background:var(--cc,var(--ink-3));margin-right:7px;vertical-align:1px}
.vend:nth-of-type(5n+1) .vh{background:var(--noon-tint)}.vend:nth-of-type(5n+2) .vh{background:var(--dawn-tint)}.vend:nth-of-type(5n+3) .vh{background:var(--day-tint)}.vend:nth-of-type(5n+4) .vh{background:var(--dusk-tint)}.vend:nth-of-type(5n+5) .vh{background:var(--gold-tint)}
.datebar .iconbtn{background:var(--gold-tint);border-color:var(--gold);color:var(--gold-ink)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.catchip{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:7px 4px;font-size:12px;font-weight:800;line-height:1.1;text-align:center;color:var(--ink-2)}
.catchip span{font-size:22px;line-height:1.1}
.catchip.on{background:var(--gold-tint);border-color:var(--gold);color:var(--ink)}
.quick{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;padding:8px 4px;border-radius:18px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);font-size:12px;font-weight:800;line-height:1.1;color:var(--ink)}
.qbtn span{font-size:24px;line-height:1.1}
.seg.big{display:flex;width:100%}
.seg.big button{flex:1;font-family:var(--display);font-weight:600;font-size:15.5px;min-height:40px}
.seg.big button.on{background:var(--gold-tint);box-shadow:inset 0 0 0 2px var(--gold)}
details.card summary::marker{color:var(--ink-3)}
.vsel{border:0;background:var(--soft);border-radius:8px;padding:1px 4px;font:800 12px var(--body);color:var(--ink-2);max-width:150px;margin-right:2px}
/* segmented */
.seg{display:inline-flex;background:var(--soft);border-radius:16px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:13px;padding:5px 11px;font-size:13.5px;font-weight:800;color:var(--ink-2);min-height:32px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 1px 2px rgba(0,0,0,.08)}
.seg button.on.g{color:var(--noon);box-shadow:inset 0 0 0 2px var(--noon)}.seg button.on.w{color:var(--gold-ink);box-shadow:inset 0 0 0 2px var(--gold);background:var(--gold-tint)}.seg button.on.b{color:var(--bad);box-shadow:inset 0 0 0 2px var(--all);background:var(--all-tint)}
.daychips{display:flex;gap:5px;flex-wrap:wrap}
.daychips button{border:2px solid var(--line);background:var(--paper);border-radius:12px;min-width:44px;padding:4px 6px;font-size:13px;font-weight:800;color:var(--ink-3)}
.daychips button.on{background:var(--gold-tint);border-color:var(--gold);color:var(--ink)}
/* ---------- today: hero + people strip ---------- */
.hero{background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:14px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;margin:8px 0 4px}
.scorebig{font-family:var(--display);font-weight:700;font-size:54px;line-height:.9;color:var(--gold-ink);font-variant-numeric:tabular-nums;grid-row:span 2;text-align:center}
.scorebig small{display:block;font-size:15px;color:var(--ink-2);font-weight:600;margin-top:5px}
.track{position:relative;height:50px;border-radius:99px;background:var(--gold-tint);border:2px solid var(--gold);overflow:hidden}
.trail{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 22px);opacity:.55;transition:width .6s ease}
.track .from,.track .goal,.track .mover{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;line-height:1}
.track .from{left:8px}.track .goal{right:8px}
.track .mover{left:calc(42px + (100% - 116px) * var(--p,0));transition:left .6s cubic-bezier(.34,1.4,.64,1)}
.herostats{display:flex;gap:8px;flex-wrap:wrap;font-weight:800;font-size:13px;color:var(--ink-2)}
.herostats span{background:var(--bg);border-radius:99px;padding:2px 10px}
.herostats span.ok{background:var(--noon-tint);color:var(--noon)}
@media (max-width:420px){.hero{grid-template-columns:1fr}.scorebig{grid-row:auto;display:flex;align-items:baseline;gap:8px;justify-content:center;font-size:44px}.scorebig small{margin:0}}
.steps{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.pstep{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;padding:9px 5px 8px;border-radius:22px;border:3px solid transparent;background:var(--paper);box-shadow:var(--shadow);color:var(--ink);position:relative}
.pstep .se{font-size:31px;line-height:1}
.pstep .sl{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.05;text-align:center}
.pstep .sr{font-size:11px;font-weight:800;color:var(--ink-2);text-align:center;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstep .sd{display:flex;gap:3px;margin-top:2px}
.pstep .sd i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pstep .sd i.on{background:var(--tone)}
.pstep.done{border-color:var(--noon);background:var(--noon-tint)}
.pstep.done::after{content:"✓";position:absolute;top:-6px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--noon);color:var(--check-ink);font-size:13px;font-weight:800;display:grid;place-items:center}
.pstep.away{opacity:.55}
/* ---------- staff cards ---------- */
.staff{padding:0;overflow:hidden;scroll-margin-top:84px}
.staff .hd{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;background:var(--tint)}
.staff > :not(.hd){margin-left:16px;margin-right:16px}
.staff > :last-child{margin-bottom:16px}
.av{width:48px;height:48px;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-size:27px;flex:none;box-shadow:0 1px 0 rgba(30,35,64,.06)}
.staff .nm{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;color:var(--ink)}
.staff .rl{font-size:13.5px;font-weight:800;color:var(--ink-2)}
.staff.done{border-color:var(--noon)}
.staff .donebadge{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--noon);color:var(--check-ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.carry{margin:12px 0 0;background:var(--dawn-tint);color:var(--ink);border-radius:16px;padding:9px 12px;font-size:14px}
.carry b{color:var(--dawn)}
.menuline{margin:12px 0 0;background:var(--bg);border-radius:16px;padding:9px 12px;font-size:14px}
.menuline b{color:var(--tone)}
.tasks{list-style:none;margin:10px 0 0;padding:0}
.tasks li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px solid var(--soft)}
.tasks li:first-child{border-top:0}
.tasks .tx{flex:1;min-width:0;font-size:15px;font-weight:700}
.tasks .tx small{display:block;color:var(--ink-3);font-size:12px}
.tri{display:flex;gap:5px;flex:none}
.tri button{width:40px;height:38px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:15px;color:var(--ink-3);transition:transform .15s}
.tri button:active{transform:scale(.9)}
.tri button.on.g{background:var(--noon);border-color:var(--noon);color:var(--check-ink)}
.tri button.on.w{background:var(--gold);border-color:var(--gold);color:#3A2600}
.tri button.on.b{background:var(--all);border-color:var(--all);color:#fff}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:26px;padding:0 1px;color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
.foot{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.reviewed{color:var(--noon);font-weight:800;font-size:14px}
.skipped{margin:12px 0 0;color:var(--ink-2);font-size:14.5px;background:var(--bg);border-radius:16px;padding:10px 12px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;min-width:0}
.progress{height:10px;border-radius:99px;background:var(--gold-tint);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:99px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow)}

.sup .t{flex:1;min-width:0}
.sup .t b{display:block;font-size:15px}
.sup .t small{color:var(--ink-2);font-size:12.5px;font-weight:700}
.step{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}

.slot{display:flex;gap:10px;padding:8px 10px;margin:6px 0 0;border-radius:16px;background:var(--tint);align-items:flex-start;cursor:pointer}
.slot:active{transform:scale(.99)}
.slot .sl{width:86px;flex:none;font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);padding-top:3px;line-height:1.1}
.slot .sl small{display:block;font-family:var(--body);font-size:11.5px;font-weight:800;color:var(--ink-2);margin-top:2px}

.dish{background:var(--paper);border-radius:99px;padding:3px 11px;font-size:14px;font-weight:800;box-shadow:0 1px 0 rgba(30,35,64,.06)}
.dish.fish::before{content:"🐟 "}
.dish.protein::before{content:"🍗 "}

.dish.diet{border:2px solid var(--noon);background:var(--noon-tint);box-shadow:none;font-weight:700}
.empty{color:var(--ink-3);font-size:14px;font-weight:700;padding-top:3px}
.banner{border-radius:var(--r);padding:14px 16px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:2px solid transparent}

.banner.sent{background:var(--gold-tint);border-color:var(--gold)}
.banner.approved{background:var(--noon-tint);border-color:var(--noon)}

.tscroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}

.taskedit{border:2px solid var(--line);border-radius:18px;padding:10px;margin-bottom:8px;background:var(--bg)}
.taskedit .row input{flex:1}
.grouplabel{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);margin-bottom:2px}
/* ---------- sheet, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,23,41,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.6}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px;max-height:86vh}}
.sheet .sh{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:8px;padding:14px 0 8px;z-index:1}
.sheet .sh h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;flex:1}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-family:var(--display);font-weight:600;font-size:15.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:rise .2s ease-out}
.toast[hidden]{display:none}
.hint{background:var(--gold-tint);border:2px solid var(--gold);border-radius:18px;padding:10px 14px;font-size:14.5px;margin:12px 0}
.famcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:20px;letter-spacing:.06em;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;user-select:all;-webkit-user-select:all}
.err{color:var(--bad)}
hr.s{border:0;border-top:2px solid var(--line);margin:14px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function upgrade(){
  let v=S().seedV||1;const v0=v;
  if(v<2){upgradeV2();v=2}
  if(v<3){const cat=items();if(cat.curd&&cat.curd.vendor==="sandip"&&!cat.curd.picked){cat.curd=Object.assign({},cat.curd,{vendor:"mini"});store.set("ghar-items",cat)}
    if(!roles().some(r=>r.id==="rinki"))store.set("ghar-roles",roles().concat([JSON.parse(JSON.stringify(SEED_ROLES.find(r=>r.id==="rinki")))]));v=3}
  if(v<4){store.set("ghar-settings",Object.assign({},S(),{budgets:fillBudgets(S().budgets)}));v=4}
  if(v!==v0)store.set("ghar-settings",Object.assign({},S(),{seedV:v}));
}
function upgradeV2(){
  const list=roles().map(r=>{const p=PAY_UPDATE_V2[r.id];if(!p||+r.rate)return r;const n=Object.assign({},r,p);
    if(r.id==="vehicle")n.tasks=(r.tasks||[]).map(t=>t.id==="vehicle-3"&&t.days&&t.days.join()==="0"?Object.assign({},t,{days:[6]}):t);return n});
  if(!list.some(r=>r.id==="gym")){const g=SEED_ROLES.find(r=>r.id==="gym");const i=list.findIndex(r=>r.id==="driver");list.splice(i>=0?i+1:list.length,0,JSON.parse(JSON.stringify(g)))}
  store.set("ghar-roles",list);
}
function seed(){
  if(!store.get("ghar-roles")) store.set("ghar-roles",SEED_ROLES);
  if(!store.get("ghar-dishes")) store.set("ghar-dishes",SEED_DISHES);
  const st=store.get("ghar-settings");
  if(!st) store.set("ghar-settings",Object.assign({},SEED_SETTINGS,{start:todayISO(),seedV:4,budgets:fillBudgets({})}));
  else if(!st.start) store.set("ghar-settings",Object.assign({},st,{start:todayISO()}));

function vToday(){
  const d=curDate,rec=dayRec(d),list=dueStaff(d),t=todayISO();

  list.forEach(r=>{if(rec.review&&rec.review[r.id])reviewed++;const a=(rec.att||{})[r.id];if(a==="absent"||a==="leave")return;tasksOn(r,d).concat((rec.extra||{})[r.id]||[]).forEach(tk=>{taskN++;const s=((rec.tasks||{})[r.id]||{})[tk.id];if(s==="done")taskDone++;else if(s==="part")taskDone+=.5})});
  const off=roles().filter(r=>r.kind==="staff"&&r.active!==false&&!list.includes(r));

    <div class="scorebig num">${reviewed}<small>/ ${list.length} reviewed</small></div>
    <div class="track" style="--p:${p}" aria-hidden="true"><div class="trail" style="width:${p*100}%"></div><span class="from">☀️</span><span class="mover">🧹</span><span class="goal">${p===1?"🌟":"🏡"}</span></div>
    <div class="herostats"><span>${taskN?pct(taskDone/taskN):"–"} tasks done</span><span class="${rec.approved?"ok":""}">${rec.approved?"✓ Day approved":"Day not approved yet"}</span></div>
  </section>`;
  const rec0=rec;
  h+=`<div class="steps" role="list">${list.map(r=>{const tk=tasksOn(r,d).concat((rec0.extra||{})[r.id]||[]),st=(rec0.tasks||{})[r.id]||{},a=(rec0.att||{})[r.id],away=a==="absent"||a==="leave";
    return `<button class="pstep${rec0.review&&rec0.review[r.id]?" done":""}${away?" away":""}" data-tone="${toneOf(r)}" data-a="jump" data-r="${r.id}" role="listitem"><span class="se">${r.icon||"👤"}</span><span class="sl">${esc(r.person)}</span><span class="sr">${esc(r.title)}</span><span class="sd">${tk.slice(0,8).map(t=>`<i class="${st[t.id]?"on":""}"></i>`).join("")}</span></button>`}).join("")}</div>`;
  h+=`<h2><span class="hic" data-tone="day" aria-hidden="true">🧹</span>Staff work <small>${list.length} due today</small></h2>`;
  // group by person so Shambhu Da / Asha sit together
  const prev=dayRec(addDays(d,-1));
  list.forEach(r=>h+=staffCard(r,d,rec,prev));
  if(off.length) h+=`<p class="muted" style="font-size:13.5px">Not scheduled today: ${off.map(r=>esc(r.person)+" ("+esc(r.title)+")").join(", ")}</p>`;
  h+=supplies(d,rec);
  // approval
  const pending=list.filter(r=>!(rec.review&&rec.review[r.id]));
  h+=`<h2><span class="hic" data-tone="noon" aria-hidden="true">✅</span>Approve the day</h2><div class="card">`;
  if(rec.approved){h+=`<div class="row"><span class="reviewed">✓ Approved by ${esc(rec.approved.by)} · ${fmtTime(rec.approved.at)}</span><span class="sp"></span><button class="btn sm ghost" data-a="unapprove">Undo</button></div>`}
  else{
    h+=`<p class="muted" style="margin:0 0 10px">${pending.length?`Still to review: ${pending.map(r=>esc(r.person)+" – "+esc(r.title)).join(", ")}.`:"All staff reviewed. Approve to lock in today’s record."}</p>`;

function staffCard(r,d,rec,prev){
  const att=(rec.att||{})[r.id]||"present",away=att==="absent"||att==="leave";
  const st=(rec.tasks||{})[r.id]||{},extra=(rec.extra||{})[r.id]||[],all=tasksOn(r,d).concat(extra);

  const sugg=prev.sugg&&prev.sugg[r.id];
  let h=`<section class="card staff${rv?" done":""}" id="card-${r.id}" data-tone="${toneOf(r)}">
   <div class="hd"><div class="av">${r.icon||"👤"}</div>
    <div style="min-width:0;flex:1"><div class="nm">${esc(r.person)}</div><div class="rl">${esc(r.title)}${r.time?" · "+esc(r.time):""}</div></div>${rv?`<span class="donebadge" title="Reviewed">✓</span>`:""}</div>
   <div class="row" style="margin-top:10px"><div class="seg" role="group" aria-label="Attendance">
    ${[["present","Present","g"],["half","Half day","w"],["absent","Absent","b"],["leave","On leave","w"]].map(([k,l,c])=>`<button class="${att===k?"on "+c:""}" data-a="att" data-r="${r.id}" data-v="${k}">${l}</button>`).join("")}
   </div></div>`;
  if(sugg) h+=`<p class="carry"><b>Yesterday’s suggestion:</b> ${esc(sugg)}</p>`;
  const slots=SLOTS.filter(s=>s.cook===r.id&&(s.id!=="child"||S().childMeal));
  if(slots.length){
    const m=menuRec(mondayOf(d)),day=m.days[d]||{};
    const txt=slots.map(s=>`<b>${s.label}:</b> ${(day[s.id]||[]).map(dishLabel).map(esc).join(", ")||'<span class="faint">not planned</span>'}`).join("<br>");
    h+=`<p class="menuline">${txt}${m.status!=="approved"?`<br><span class="chip warn" style="margin-top:4px">Menu not approved yet</span>`:""}</p>`;
  }
  if(away){h+=`<p class="skipped">${att==="absent"?"Absent":"On leave"} today – tasks skipped. ${all.length} task${all.length===1?"":"s"} not done.</p>`}
  else{
    h+=`<ul class="tasks">${all.map(t=>{const s=st[t.id];const isX=extra.includes(t);return `<li><div class="tx">${esc(t.text)}${isX?`<small>Extra task for today · <a href="#" data-a="rmExtra" data-r="${r.id}" data-t="${t.id}">remove</a></small>`:""}</div>
      <div class="tri" role="group" aria-label="Status">
       <button class="${s==="done"?"on g":""}" data-a="tk" data-r="${r.id}" data-t="${t.id}" data-v="done" aria-label="Done" title="Done">✓</button>
       <button class="${s==="part"?"on w":""}" data-a="tk" data-r="${r.id}" data-t="${t.id}" data-v="part" aria-label="Partly done" title="Partly done">½</button>
       <button class="${s==="miss"?"on b":""}" data-a="tk" data-r="${r.id}" data-t="${t.id}" data-v="miss" aria-label="Not done" title="Not done">✗</button></div></li>`}).join("")}</ul>`;
    h+=`<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-a="allDone" data-r="${r.id}">Mark all done</button><span class="faint" style="font-size:12.5px">${doneN}/${all.length} checked</span></div>`;
    h+=`<div class="addrow"><input class="in" id="ex-${r.id}" placeholder="Add an extra task for today" data-enter="addExtra" data-r="${r.id}"><button class="btn sm" data-a="addExtra" data-r="${r.id}">Add</button></div>`;
  }
  const rating=(rec.rating||{})[r.id]||0;
  h+=`<div class="foot">

async function unzipEntry(buf,want){ // minimal .zip reader (a .docx is a zip)
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let e=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}

  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),size=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));
    if(name===want){const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=buf.subarray(start,start+size);
      if(method===0)return new TextDecoder().decode(data);
      if(method===8){const out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();return new TextDecoder().decode(out)}
      throw new Error("This Word file uses an unusual format.")}
    p+=46+nl+el+cl;
  }
  throw new Error("No text found inside this Word file.");
}
function docxXmlToText(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml"),W="http://schemas.openxmlformats.org/wordprocessingml/2006/main",lines=[];
  const pText=p=>{let t="";for(const el of p.getElementsByTagNameNS(W,"*")){const n=el.localName;if(n==="t")t+=el.textContent;else if(n==="tab")t+=" ";else if(n==="br"||n==="cr")t+=" "}return t.replace(/\s+/g," ").trim()};
  const walk=node=>{for(const el of node.children){
    if(el.localName==="p"){const t=pText(el);if(t)lines.push(t)}
    else if(el.localName==="tbl"){for(const tr of el.children){if(tr.localName!=="tr")continue;const cells=[...tr.children].filter(c=>c.localName==="tc").map(tc=>[...tc.getElementsByTagNameNS(W,"p")].map(pText).filter(Boolean).join(" "));if(cells.some(Boolean))lines.push(cells.join(" | "))}}
    else walk(el)}};
  const body=doc.getElementsByTagNameNS(W,"body")[0];if(body)walk(body);

async function readDietFile(file){

  let h=+m[1];const ap=(m[3]||"").toLowerCase()[0];if(ap==="p"&&h<12)h+=12;if(ap==="a"&&h===12)h=0;if(h>23)return null;const x=h+(+(m[2]||0))/60;

const mealOf=t=>{for(const k of ["mid","bed","early","breakfast","lunch","evening","dinner"])if(MEAL_RE[k].test(t)){if(k==="early"&&MEAL_RE.breakfast.test(t)&&!/\b(pre|before)\b/i.test(t))return "breakfast";return k}return null};
const mealOrTime=t=>mealOf(t)||(t.length<24?timeMeal(t):null);
const dayOf=t=>{t=(t||"").trim();let m=t.match(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?$/i);if(m)return "wd:"+["sun","mon","tue","wed","thu","fri","sat"].indexOf(m[1].toLowerCase());m=t.match(/^day\s*-?\s*(\d{1,2})$/i);return m?"day:"+m[1]:null};
function parseDietMeals(text){
  const out={generic:{},byDay:{}};
  const add=(dk,meal,txt)=>{txt=(txt||"").replace(/^[\s:–\-|•*]+/,"").replace(/^\(?(\d{1,2}[:.]\d{2}\s*(am|pm)?|\d{1,2}\s*(am|pm))\)?\s*[:–-]?\s*/i,"").replace(/^(early morning|breakfast|lunch|dinner|supper|mid[- ]?morning|evening( snacks?)?|snacks?|bed ?time)\s*(\([^)]*\))?\s*[:–-]\s*/i,"").trim();if(!txt||txt.length<2)return;const o=dk?(out.byDay[dk]=out.byDay[dk]||{}):out.generic;(o[meal]=o[meal]||[]).push(txt)};
  let mode=null,cols=[],cur=null;
  for(const line of text.replace(/\r/g,"").split(/\n+/).map(l=>l.replace(/\t+/g," | ").replace(/\s*\|\s*$/,"").trim()).filter(Boolean)){
    if(AVOID_RE.test(line)){cur=null;continue}
    const cells=line.split("|").map(c=>c.trim());
    if(cells.length>=3){
      const dc=cells.map(dayOf),mc=cells.map(c=>c.length<32?mealOf(c):null);
      if(dc.filter(Boolean).length>=3){mode="days";cols=dc;cur=null;continue}           // header: | Mon | Tue | …
      if(mc.filter(Boolean).length>=2){mode="meals";cols=mc;cur=null;continue}         // header: Day | Breakfast | Lunch | …
      if(mode==="days"){const m=mealOrTime(cells[0]);if(m){cells.forEach((c,i)=>{if(i&&cols[i])add(cols[i],m,c)});continue}}
      if(mode==="meals"){const d=dayOf(cells[0]);cells.forEach((c,i)=>{if(i&&cols[i])add(d,cols[i],c)});continue}
    }
    const m1=line.match(/^([^:|–(]{2,45}?)\s*(?:\([^)]*\))?\s*(?:[:|–]|\s-\s)\s*(.+)$/);
    if(m1&&mealOrTime(m1[1])){cur=mealOrTime(m1[1]);add(null,cur,m1[2]);continue}
    const tl=line.match(/^\(?(\d{1,2}(?:[:.]\d{2})?\s*(?:am|pm|a\.m\.|p\.m\.)|\d{1,2}[:.]\d{2})\)?\s*(?:[:|–-]\s*)?(.{3,})$/i); // "7:00 am Warm water…"
    if(tl&&timeMeal(tl[1])){const lead=tl[2].match(/^([^:|–]{2,30}?)\s*(?:[:|–]|\s-\s)\s*(.+)$/);cur=(lead&&mealOf(lead[1]))||timeMeal(tl[1]);add(null,cur,lead&&mealOf(lead[1])?lead[2]:tl[2]);continue}
    if(line.length<45&&mealOrTime(line)&&!/,/.test(line)){cur=mealOrTime(line);continue}  // a heading on its own line
    if(cur&&line.length<220&&!/^(note|tips?|instructions?|general|drink|water|exercise)/i.test(line))add(null,cur,line);
  }
  return out;
}
function mealsFor(p,d,from){
  const pm=p.meals||{generic:{},byDay:{}},by=pm.byDay||{};
  let day=by["wd:"+dow(d)];
  if(!day&&Object.keys(by).some(k=>k.startsWith("day:"))){const n=Object.keys(by).filter(k=>k.startsWith("day:")).length||7;day=by["day:"+(1+Math.round((toD(d)-toD(from))/864e5)%n)]}
  return Object.assign({},pm.generic||{},day||{});
}

// Which shop should an item go to? 1) what the family chose before, 2) a shop whose job names the item
// (Sandip: "Fish, Paneer, Mushroom, Ghee"), 3) the usual shop for that kind of item, 4) the grocery shop.
const HINT_CAT={dipankar:"veg",raju:"fruit",sandip:"fish",milk:"milk",mini:"grocery",dipti:"med"};
function shopRoles(){return roles().filter(r=>r.active!==false&&(r.kind==="vendor"||r.id==="milk")&&r.cat!=="transport")}
function pickVendor(name,hint){
  const key=(name||"").trim().toLowerCase(),shops=shopRoles(),ok=id=>shops.some(r=>r.id===id);
  if(!hint){const d=DIET_WORDS.find(d=>d.n.toLowerCase()===key||d.w.includes(key));if(d)hint=d.v}
  const learned=items()[key];if(learned&&learned.picked&&ok(learned.vendor))return learned.vendor;
  const sing=key.replace(/(es|s)$/,"");
  const named=shops.find(r=>r.title.toLowerCase().split(/[^a-z]+/).some(w=>w&&(w===key||w===sing||w.replace(/(es|s)$/,"")===sing)));
  if(named)return named.id;
  if(learned&&ok(learned.vendor))return learned.vendor;
  if(hint&&ok(hint))return hint;
  const cat=HINT_CAT[hint];const same=cat&&shops.find(r=>r.cat===cat);if(same)return same.id;
  const groc=shops.find(r=>r.cat==="grocery");return groc?groc.id:(shops[0]||{}).id||"mini";
}

    return `<div class="col" title="${fmtMonth(x)}: ${rupee(sum)}"><span class="vl num">${sum?(sum>=1000?"₹"+(sum/1000).toFixed(sum>=1e5?0:1)+"k":rupee(sum)):""}</span><div class="stack" style="height:${sum/max*130}px">${usedCats.map(c=>d[c]?`<i style="height:${d[c]/sum*100}%;background:var(${CAT_COLOR[c]})" title="${CATS[c]}: ${rupee(d[c])}"></i>`:"").join("")}</div><span class="lb">${fmtMon(x)}</span></div>`}).join("")}</div>
    ${usedCats.length?`<div class="legend">${usedCats.map(c=>`<span><i style="background:var(${CAT_COLOR[c]})"></i>${CATS[c]}</span>`).join("")}</div>`:'<p class="muted" style="margin:8px 0 0">No spending recorded yet.</p>'}</div>`;
  // category table
  h+=`<h2><span class="hic" data-tone="dawn" aria-hidden="true">🥧</span>Where the money went <small>${fmtMonth(m)}</small></h2><div class="card">${Object.keys(CATS).filter(c=>sp[c]||psp[c]).sort((a,b)=>sp[b]-sp[a]).map(c=>{const ch=psp[c]?(sp[c]-psp[c])/psp[c]:NaN;
    return `<div class="hbar"><span>${CATS[c]}</span><div class="bar"><i style="width:${tot?sp[c]/tot*100:0}%;background:var(${CAT_COLOR[c]})"></i></div><span class="num r" style="text-align:right;font-weight:700">${rupee(sp[c])}</span></div>
     <div class="faint" style="font-size:12px;margin:-4px 0 4px">${tot?pct(sp[c]/tot)+" of spend":""}${isFinite(ch)?` · ${ch>=0?"▲":"▼"} ${pct(Math.abs(ch))} vs ${fmtMon(pm)}`:""}</div>`}).join("")||'<p class="muted" style="margin:0">No spending recorded yet.</p>'}</div>`;
  // staff table
  h+=`<h2><span class="hic" data-tone="noon" aria-hidden="true">🏆</span>Staff performance</h2><div class="card"><div class="tscroll"><table class="t"><thead><tr><th>Staff</th><th class="r">Done well</th><th class="r">Days off</th><th class="r">Rating</th><th class="r">Reviewed</th></tr></thead><tbody>
   ${arr.map(o=>{const p=pss[o.r.id],d=p&&isFinite(p.rate)&&isFinite(o.rate)?o.rate-p.rate:NaN;
     return `<tr><td><b>${esc(o.r.person)}</b><small>${esc(o.r.title)}</small></td><td class="r num" style="color:${!isFinite(o.rate)?"var(--ink-3)":o.rate>=.9?"var(--good)":o.rate>=.75?"var(--warn)":"var(--bad)"};font-weight:800">${pct(o.rate)}${isFinite(d)&&Math.abs(d)>=.05?`<small>${d>0?"▲":"▼"} ${pct(Math.abs(d))}</small>`:""}</td>
     <td class="r num">${o.absent}</td><td class="r num">${isFinite(o.avgRating)?o.avgRating.toFixed(1)+" ★":"–"}</td><td class="r num">${o.revDays}/${o.days}</td></tr>`}).join("")}</tbody></table></div></div>`;
  // most missed
  const mm=[];arr.forEach(o=>Object.entries(o.missed).forEach(([k,n])=>mm.push([o.r,k,n])));mm.sort((a,b)=>b[2]-a[2]);
  if(mm.length) h+=`<h2><span class="hic" data-tone="all" aria-hidden="true">🔁</span>Most often missed</h2><div class="card">${mm.slice(0,6).map(([r,k,n])=>`<div class="li" style="cursor:default"><div class="av" style="width:34px;height:34px;font-size:17px">${r.icon}</div><div class="t">${esc(k)}<small>${esc(r.person)} · ${esc(r.title)}</small></div><b class="num">${n}×</b></div>`).join("")}</div>`;
  return h;
}

function captureRole(){ // read form into sheetCtx.r

const A={
  view:e=>go(e.dataset.v),
  jump:e=>{const c=$("card-"+e.dataset.r);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},
  who:()=>whoSheet(),
  setMe:e=>{local("me",e.dataset.u);closeSheet();render();toast("Hi "+e.dataset.u)},
  close:()=>closeSheet(),
  day:e=>{const n=+e.dataset.n;curDate=n?addDays(curDate,n):todayISO();render()},
  week:e=>{const n=+e.dataset.n;curWeek=n?addDays(curWeek,7*n):mondayOf(todayISO());render()},
  month:e=>{const n=+e.dataset.n;curMonth=n?addMonths(curMonth,n):monthOf(todayISO());render()},
  att:e=>{editDay(curDate,r=>{r.att=r.att||{};if(e.dataset.v==="present")delete r.att[e.dataset.r];else r.att[e.dataset.r]=e.dataset.v});render()},
  tk:e=>{const {r:rid,t,v}=e.dataset;editDay(curDate,r=>{r.tasks=r.tasks||{};const o=r.tasks[rid]=r.tasks[rid]||{};o[t]=o[t]===v?undefined:v;if(!o[t])delete o[t]});render()},
  allDone:e=>{const rid=e.dataset.r,ro=role(rid);editDay(curDate,r=>{r.tasks=r.tasks||{};const o=r.tasks[rid]=r.tasks[rid]||{};tasksOn(ro,curDate).concat((r.extra||{})[rid]||[]).forEach(t=>{if(!o[t.id])o[t.id]="done"})});render()},
  addExtra:e=>{const rid=e.dataset.r,inp=$("ex-"+rid),txt=inp.value.trim();if(!txt)return;editDay(curDate,r=>{r.extra=r.extra||{};(r.extra[rid]=r.extra[rid]||[]).push({id:"x"+uid(),text:txt})});render()},
  rmExtra:(e,ev)=>{ev.preventDefault();const {r:rid,t}=e.dataset;editDay(curDate,r=>{r.extra[rid]=(r.extra[rid]||[]).filter(x=>x.id!==t);if(r.tasks&&r.tasks[rid])delete r.tasks[rid][t]});render()},
  rate:e=>{const {r:rid,v}=e.dataset;editDay(curDate,r=>{r.rating=r.rating||{};r.rating[rid]=r.rating[rid]===+v?0:+v});render()},
  review:e=>{if(!me())return whoSheet();const rid=e.dataset.r;editDay(curDate,r=>{r.review=r.review||{};r.review[rid]={by:me(),at:Date.now()}});render();toast("Review saved")},
  unreview:e=>{editDay(curDate,r=>{if(r.review)delete r.review[e.dataset.r]});render()},
  approveDay:()=>{if(!me())return whoSheet();editDay(curDate,r=>{r.approved={by:me(),at:Date.now()}});render();toast("Day approved ✓")},
  unapprove:()=>{editDay(curDate,r=>{delete r.approved});render()},
  supq:e=>{const {r:rid}=e.dataset,n=+e.dataset.n,ro=role(rid);editDay(curDate,r=>{r.sup=r.sup||{};const s=r.sup[rid]=r.sup[rid]||{};const cur=s.qty==null?(ro.pay==="daily"?+ro.qty||0:0):+s.qty;s.qty=Math.max(0,Math.round((cur+n)*100)/100)});render()},
  supIssue:e=>{editDay(curDate,r=>{r.sup=r.sup||{};const s=r.sup[e.dataset.r]=r.sup[e.dataset.r]||{};s.issue=!s.issue});render()},
  supGot:e=>{editDay(curDate,r=>{r.sup=r.sup||{};const s=r.sup[e.dataset.r]=r.sup[e.dataset.r]||{};s.got=s.got===false});render()},
  gotAll:e=>{const list=shop().map(i=>i.vendor===e.dataset.v&&i.status==="ordered"?Object.assign({},i,{status:"got",gotOn:curDate,check:"ok"}):i);store.set("ghar-shop",list);render();toast("Marked received")},
  // menu
  predict:()=>{const m=menuRec(curWeek),has=weekDays(curWeek).some(d=>Object.values(m.days[d]||{}).some(a=>a&&a.length));
    if(has&&!confirm("Replace the whole week with a new prediction?\n(Cancel fills only the empty meals.)")){predictWeek(curWeek,true)}else predictWeek(curWeek,false);render();toast("Menu predicted – check and send for approval")},
  sendMenu:()=>{const m=JSON.parse(JSON.stringify(menuRec(curWeek)));if(isApprover()){m.status="approved";m.by=me();m.at=Date.now()}else{m.status="sent";m.sentBy=me()||"";m.sentAt=Date.now()}store.set(menuKey(curWeek),m);render();toast(m.status==="approved"?"Approved ✓":"Sent to "+S().approver)},
  approveMenu:()=>{const m=JSON.parse(JSON.stringify(menuRec(curWeek)));m.status="approved";m.by=me();m.at=Date.now();delete m.note;store.set(menuKey(curWeek),m);render();toast("Menu approved ✓")},
  changesMenu:()=>{const n=prompt("What should change?");if(n==null)return;const m=JSON.parse(JSON.stringify(menuRec(curWeek)));m.status="changes";m.by=me();m.at=Date.now();m.note=n;store.set(menuKey(curWeek),m);render()},
  reopenMenu:()=>{const m=JSON.parse(JSON.stringify(menuRec(curWeek)));m.status="draft";store.set(menuKey(curWeek),m);render()},
  editSlot:e=>slotSheet(e.dataset.d,e.dataset.s),
  slotRm:e=>{sheetCtx.list.splice(+e.dataset.i,1);paintSlotSheet(SLOTS.find(x=>x.id===sheetCtx.slot))},

var SYNC_RE=/^ghar-/;
var sync=Object.assign({code:"",device:""},local("sync")||{});
var syncMeta=local("sync-meta")||{};
var syncDb=null,syncUnsub=null,syncApplying=false,syncQueue=new Set(),syncTimer=0,syncState="off",syncLast=0,syncErr="";
if(!sync.device){sync.device=Math.random().toString(36).slice(2,10);local("sync",sync)}
function saveSync(){local("sync",sync)}
function syncTouch(k){
  if(!SYNC_RE||!syncMeta||syncApplying||!SYNC_RE.test(k))return;
  syncMeta[k]=Date.now();local("sync-meta",syncMeta);
  if(!sync.code)return;
  syncQueue.add(k);clearTimeout(syncTimer);syncTimer=setTimeout(syncFlush,500);
}
function syncItems(){return syncDb.collection("families").doc(sync.code).collection("items")}
function syncFlush(){
  if(!syncDb||!sync.code)return;
  const keys=[...syncQueue];syncQueue.clear();if(!keys.length)return;
  const batch=syncDb.batch();
  keys.forEach(k=>{let v=null;try{v=localStorage.getItem(k)}catch(e){}batch.set(syncItems().doc(k),{v,t:syncMeta[k]||Date.now(),by:sync.device})});
  batch.commit().then(()=>{syncLast=Date.now();syncState="on";paintSync()}).catch(e=>{keys.forEach(k=>syncQueue.add(k));syncErr=e.message;syncState="bad";paintSync()});
}

      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);}
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    if(!syncDb){syncDb=firebase.firestore();try{await syncDb.enablePersistence({synchronizeTabs:true})}catch(e){}}
    if(!firebase.auth().currentUser)await firebase.auth().signInAnonymously();
    if(syncUnsub)syncUnsub();
    let first=true;
    syncUnsub=syncItems().onSnapshot(snap=>{
      const changed=new Set(),remote={};
      snap.docChanges().forEach(ch=>{const k=ch.doc.id,d=ch.doc.data();remote[k]=d.t;if(d.t>(syncMeta[k]||0)){syncApply(k,d.v);syncMeta[k]=d.t;changed.add(k)}});
      if(first){first=false;const have=new Set(snap.docs.map(x=>x.id));snap.docs.forEach(x=>remote[x.id]=x.data().t);
        for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(SYNC_RE.test(k)&&(!have.has(k)||(syncMeta[k]||0)>(remote[k]||0))){syncMeta[k]=syncMeta[k]||1;syncQueue.add(k)}}
        if(syncQueue.size)syncFlush();}
      local("sync-meta",syncMeta);
      syncLast=Date.now();syncState="on";syncErr="";paintSync();
      if(changed.size)syncRefresh();
    },e=>{syncState="bad";syncErr=e.message;paintSync()});
  }catch(e){syncState="bad";syncErr=e.message||String(e);paintSync()}
}
function syncApply(k,v){syncApplying=true;try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}delete mem[k];syncApplying=false}
let refreshWanted=false;
function syncRefresh(){
  const a=document.activeElement,typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
  if(!$("scrim").hidden||typing){refreshWanted=true;return}
  render();
}
document.addEventListener("focusout",()=>{if(refreshWanted)setTimeout(()=>{const a=document.activeElement;if(refreshWanted&&$("scrim").hidden&&!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))){refreshWanted=false;render()}},300)});
const CODE_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const fmtCode=c=>c.replace(/(.{4})(?=.)/g,"$1-");
function newCode(){const a=new Uint32Array(16);crypto.getRandomValues(a);return [...a].map(n=>CODE_ABC[n%CODE_ABC.length]).join("")}
function syncStatusHTML(){
  let dot="",msg="";
  if(!sync.code)msg="Not shared yet – this phone keeps its own copy.";
  else if(syncState==="bad"){dot="bad";msg="Sync problem: "+esc(syncErr)}
  else if(!navigator.onLine){dot="wait";msg="Offline – changes will sync when back online."}
  else if(syncState==="on"){dot="on";msg="Synced ✓ "+(Date.now()-syncLast<60e3?"just now":"at "+new Date(syncLast).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}))}
  else{dot="wait";msg="Connecting…"}
  return (dot?`<span class="syncdot ${dot}"></span>`:"")+msg;
}
function syncHTML(){
  if(!sync.code) return `<p class="muted" style="margin:0 0 10px;font-size:14px">So you and ${esc(S().users.find(u=>u!==me())||"your wife")} see the same data: on the first phone tap <b>Start sharing</b>, then on the second phone type the code and tap <b>Join</b>.</p>
   <button class="btn pri" data-a="syncStart">Start sharing</button>
   <div class="addrow" style="margin-top:12px"><input class="in" id="syncCodeIn" placeholder="Code, e.g. ABCD-EFGH-JKLM-NPQR" autocomplete="off" autocapitalize="characters"><button class="btn" data-a="syncJoin">Join</button></div>
   <p class="muted" id="syncStatus" style="font-size:13px;margin:10px 0 0">${syncStatusHTML()}</p>`;
  return `<p class="muted" style="margin:0 0 8px;font-size:14px">Household code – type this on the other phone:</p><div class="famcode">${fmtCode(sync.code)}</div>
   <p id="syncStatus" style="font-size:13.5px;margin:10px 0">${syncStatusHTML()}</p>
   <div class="row"><button class="btn sm" data-a="syncCopy">Copy code</button><button class="btn sm" data-a="syncNow">Sync now</button><span class="sp"></span><button class="btn sm ghost bad" data-a="syncStop">Stop syncing here</button></div>`;
}
function paintSync(){const el=$("syncStatus");if(el)el.innerHTML=syncStatusHTML()}
addEventListener("online",()=>{paintSync();if(sync.code&&syncState!=="on")syncConnect()});
addEventListener("offline",paintSync);

/* ============ start ============ */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&$("scrim").hidden)render()});
seed();
upgrade();
render();
if(!me())setTimeout(whoSheet,300);
if(sync.code)syncConnect();
</script>
</body>
